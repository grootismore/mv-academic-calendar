[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mv-academic-calendar"
version = "0.1.0"
description = "Maldives school academic calendar data, 2015 to 2027: terms, exams and holidays. Offline, no dependencies. Unofficial."
readme = "README.md"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "DATA-LICENSE.md"]
requires-python = ">=3.11"
authors = [{ name = "grootismore" }]
keywords = ["maldives", "academic-calendar", "school-calendar", "holidays", "icalendar", "open-data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/grootismore/mv-academic-calendar"
Issues = "https://github.com/grootismore/mv-academic-calendar/issues"
Documentation = "https://github.com/grootismore/mv-academic-calendar/wiki"

[tool.hatch.build]
artifacts = ["src/mv_academic_calendar/_data/**", "LICENSE", "DATA-LICENSE.md"]   # generated, so not in git, but must ship

[tool.hatch.build.targets.wheel]
packages = ["src/mv_academic_calendar"]

[tool.hatch.build.targets.sdist]
include = ["src/mv_academic_calendar", "README.md", "LICENSE", "DATA-LICENSE.md", "pyproject.toml"]
