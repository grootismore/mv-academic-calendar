title: "[Question] "
body:
  - type: markdown
    attributes:
      value: "Ask about using the data. Please check the [wiki](../wiki) and the README first. To report a wrong date or name, use a [data correction](../issues/new?template=data-correction.yml) instead."
  - type: textarea
    id: question
    attributes: { label: Your question }
    validations: { required: true }
  - type: input
    id: calendar
    attributes: { label: "Which calendar, if any", description: "For example 2026 or 2023-2024" }
