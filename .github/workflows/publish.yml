name: publish packages
# Publishes to npm and PyPI whenever a package version on main is new. Versions that already exist are skipped.
on:
  push:
    branches: [main]
    paths: ["packages/js/package.json", "packages/python/pyproject.toml", ".github/workflows/publish.yml"]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      npm_new: ${{ steps.npm.outputs.new }}
      pypi_new: ${{ steps.pypi.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - name: Both packages must have the same version
        id: v
        run: |
          JS=$(python3 -c "import json;print(json.load(open('packages/js/package.json'))['version'])")
          PY=$(python3 -c "import tomllib;print(tomllib.load(open('packages/python/pyproject.toml','rb'))['project']['version'])")
          echo "js=$JS py=$PY"
          [ "$JS" = "$PY" ] || { echo "::error::package versions differ"; exit 1; }
          echo "version=$JS" >> "$GITHUB_OUTPUT"
      - name: Is this version already on npm?
        id: npm
        run: |
          if npm view "mv-academic-calendar@${{ steps.v.outputs.version }}" version >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Is this version already on PyPI?
        id: pypi
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/mv-academic-calendar/${{ steps.v.outputs.version }}/json")
          if [ "$code" = "200" ]; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
  npm:
    needs: check
    if: needs.check.outputs.npm_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # for npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - name: Skip when no npm token is configured
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not set, skipping the npm publish"
      - if: env.NODE_AUTH_TOKEN != ''
        working-directory: packages/js
        run: |
          cp ../../LICENSE ../../DATA-LICENSE.md .
          npm install --no-audit --no-fund
          npm test
          npm publish --provenance --access public
  pypi:
    needs: check
    if: needs.check.outputs.pypi_new == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # PyPI trusted publishing, no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python packages/sync_data.py && cp LICENSE DATA-LICENSE.md packages/python/
      - working-directory: packages/python
        run: |
          PYTHONPATH=src python -m unittest discover -s tests
          pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
