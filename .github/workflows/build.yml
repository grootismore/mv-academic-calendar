name: build derived files
on:
  push:
    branches: [main]
    paths: ["data/[0-9]*.json", build_ics.py]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python build_ics.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "Regenerate ICS, index.json, all.json" && git push)
